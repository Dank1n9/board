<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本周抽象排行榜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            position: relative;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 固定背景 + 模糊 + 45%黑遮罩 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url('./ASS/img/bj.png') no-repeat center center;
            background-size: auto 100%;
            z-index: -2;
            filter: blur(4px);
            transform: scale(1.1);
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: #000;
            opacity: 0.45;
            z-index: -1;
        }

        /* 头部 Logo 圆角 */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            height: 80px;
            border-radius: 16px;
            overflow: hidden;
        }

        /* 标题 */
        .title {
            text-align: center;
            color: white;
            font-size: 32px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* 排行榜容器 */
        .rank-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 榜单项 原样式完全不变 */
        .rank-item {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            align-items: stretch;
            gap: 25px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .rank-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: white;
        }

        .rank-number {
            background-color: #fff3cd;
            color: #ffc107;
            font-size: 72px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            border-radius: 12px 0 0 12px;
            margin: -30px 0 -30px -30px;
        }

        .rank-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .content-header {
            margin-bottom: 20px;
        }
        .content-title {
            font-size: 28px;
            font-weight: bold;
            color: #222;
            margin-bottom: 10px;
        }
        .content-desc {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
        }

        .media-cards {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .media-card {
            flex: 1;
            background: #f8f9fa;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e9ecef;
        }
        .media-preview {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
        }
        .media-preview img,
        .media-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 隐藏图片资源、视频资源文字行 */
        .media-label {
            display: none;
        }

        .view-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #e3f2fd;
            color: #1976d2;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .view-btn:hover {
            background: #1976d2;
            color: white;
        }

        .rank-stats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 15px;
            padding-left: 20px;
            border-left: 1px solid #eee;
        }
        .stat-hot {
            text-align: right;
        }
        .hot-number {
            font-size: 36px;
            font-weight: bold;
            color: #ff7043;
        }
        .hot-label {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }
        .stat-views {
            font-size: 16px;
            color: #666;
        }

        video {
            outline: none;
        }

        /* 弹窗样式 */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-box {
            width: 90%;
            max-width: 900px;
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            padding: 30px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-media {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .modal-media img,
        .modal-media video {
            width: 50%;
            border-radius: 12px;
            object-fit: cover;
        }
        .modal-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #222;
        }
        .modal-desc {
            font-size: 17px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .modal-data {
            font-size: 16px;
            color: #ff7043;
            font-weight: bold;
        }
        .close-btn {
            margin-top: 20px;
            padding: 10px 30px;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
    </style>
</head>

<script>
// 视频悬浮播放逻辑
const items = document.querySelectorAll('.rank-item');
const videos = document.querySelectorAll('video');
videos.forEach(vid => {
    vid.pause();
    vid.muted = true;
});
items.forEach(item => {
    let video = item.querySelector('video');
    item.addEventListener('mouseenter', () => {
        if(video){
            video.muted = false;
            video.play();
        }
    });
    item.addEventListener('mouseleave', () => {
        if(video){
            video.pause();
            video.muted = true;
        }
    });
});

// 弹窗详情功能
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const modalVideoSrc = document.getElementById('modalVideoSrc');
const modalVideo = document.getElementById('modalVideo');
const modalTitle = document.getElementById('modalTitle');
const modalDesc = document.getElementById('modalDesc');
const modalData = document.getElementById('modalData');

document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', function(e){
        e.stopPropagation();
        let item = this.closest('.rank-item');

        let title = item.querySelector('.content-title').innerText.trim();
        let desc = item.querySelector('.content-desc').innerText.trim();
        let imgUrl = item.querySelector('.media-preview').style.backgroundImage.replace(/url\(["']?|["']?\)/g,'');
        let vidUrl = item.querySelector('.media-preview video source').src;
        let hot = item.querySelector('.hot-number').innerText.trim();
        let view = item.querySelector('.stat-views').innerText.trim();

        modalTitle.innerText = title;
        modalDesc.innerText = desc;
        modalImg.src = imgUrl;
        modalVideoSrc.src = vidUrl;
        modalVideo.load();
        modalData.innerText = `热度：${hot} ｜ ${view}`;

        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    });
});

function closeModal(){
    modal.style.display = 'none';
    modalVideo.pause();
    document.body.style.overflow = '';
}
modal.addEventListener('click', function(e){
    if(e.target === modal) closeModal();
});
</script>
